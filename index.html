<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Flare Fitness — Maintenance App</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="topbar-brand">
      <img src="logo.png" alt="Flare Fitness" class="topbar-logo" />
      <div class="topbar-titles">
        <div id="topbar-title" class="topbar-title">صيانة Flare Fitness</div>
        <div id="topbar-sub" class="topbar-sub">نظام إدارة طلبات الصيانة</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-action-counter" class="icon-pill hidden" type="button">
        <span id="lbl-needs-action">محتاج إجراء</span>
        <span id="action-counter-num" class="action-badge">0</span>
      </button>
      <button id="btn-lang-toggle" class="icon-pill" type="button">EN</button>
      <button id="btn-logout" class="icon-pill hidden" type="button">خروج</button>
    </div>
  </header>

  <div id="net-bar" class="net-bar"></div>
  <main id="app-root" class="container"></main>

  <nav id="bottom-nav" class="bottom-nav hidden"></nav>

  <div id="modal-root" class="modal-backdrop hidden"></div>
  <div id="toast-root" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="image-utils.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="ext.js"></script>
</body>
</html>
